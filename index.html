<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExamPanic AI Dashboard 🚀</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:
radial-gradient(circle at top left,#38bdf830,transparent 25%),
radial-gradient(circle at bottom right,#8b5cf630,transparent 25%),
#020617;
color:white;
min-height:100vh;
}

/* HEADER */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
border-bottom:1px solid rgba(255,255,255,0.08);
}

.logo{
font-size:26px;
font-weight:700;
color:#38bdf8;
}

/* HERO */
.hero{
padding:40px 8%;
text-align:center;
}

.hero h1{
font-size:46px;
}

.hero span{
color:#38bdf8;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
padding:0 8%;
margin-top:25px;
}

/* GLASS CARD */
.card{
background:rgba(255,255,255,0.05);
padding:22px;
border-radius:22px;
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
cursor:pointer;
transition:0.3s;
}

.card:hover{
transform:translateY(-10px) scale(1.03);
box-shadow:0 0 40px rgba(56,189,248,0.25);
}

.card h2{
color:#38bdf8;
margin-bottom:10px;
}

.card p{
opacity:0.8;
font-size:14px;
}

/* ML POPUP */
.overlay{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
backdrop-filter:blur(8px);
justify-content:center;
align-items:center;
}

.ml-box{
width:350px;
padding:20px;
border-radius:20px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.1);
box-shadow:0 0 40px rgba(56,189,248,0.3);
}

input{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:10px;
background:#111827;
color:white;
}

button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:10px;
background:linear-gradient(45deg,#38bdf8,#8b5cf6);
color:white;
font-weight:700;
cursor:pointer;
}

.close{
background:red;
}

.result{
margin-top:10px;
padding:10px;
background:#111827;
border-radius:10px;
font-size:14px;
}

</style>
</head>

<body>

<div class="topbar">
<div class="logo">🚀 ExamPanic AI</div>
</div>

<div class="hero">
<h1>Smart <span>Learning Dashboard</span> ⚡</h1>
</div>

<div class="grid">

<div class="card">
<h2>📘 Learn</h2>
<p>AI teacher explains chapters deeply.</p>
</div>

<div class="card">
<h2>📝 Notes</h2>
<p>Exam ready notes generator.</p>
</div>

<div class="card" onclick="openML()">
<h2>🎯 ML Prediction</h2>
<p>Click to predict exam score</p>
</div>

<div class="card">
<h2>💬 AI Chat</h2>
<p>Doubt solving AI tutor</p>
</div>

</div>

<!-- POPUP -->
<div class="overlay" id="overlay">

<div class="ml-box">

<h3>📊 ML Prediction</h3>

<input id="chap" placeholder="Chapters Done">
<input id="rev" placeholder="Revision Count">
<input id="att" placeholder="Attendance %">
<input id="test" placeholder="Test Score %">

<button onclick="predict()">Predict</button>
<button class="close" onclick="closeML()">Close</button>

<div class="result" id="result">Result will appear here</div>

</div>

</div>

<script>

const API = "https://studentscoreprediction.santoshkrsbg36.workers.dev/";

function openML(){
document.getElementById("overlay").style.display="flex";
}

function closeML(){
document.getElementById("overlay").style.display="none";
}

async function predict(){

let chapters = document.getElementById("chap").value;
let revision = document.getElementById("rev").value;
let attendance = document.getElementById("att").value;
let test = document.getElementById("test").value;

if(!chapters || !revision || !attendance || !test){
alert("Fill all fields");
return;
}

document.getElementById("result").innerHTML="Predicting...";

try{

let res = await fetch(API,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
chapters_done:Number(chapters),
revision_count:Number(revision),
attendance:Number(attendance),
test_score:Number(test)
})
});

let data = await res.json();

document.getElementById("result").innerHTML =
`📊 Score: <b>${data.predicted_marks}%</b><br>⚡ ${data.performance}`;

}catch(e){
document.getElementById("result").innerHTML="Error in API";
}

}

</script>

</body>
</html>
